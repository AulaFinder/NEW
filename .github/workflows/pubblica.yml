name: Pubblica AulaFinder V52 da un solo ZIP
on:
  push:
    branches: [main]
    paths:
      - 'AulaFinder_SITE.zip'
      - '.github/workflows/pubblica.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica i file del repository
        uses: actions/checkout@v4
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Estrai e controlla lo ZIP
        run: |
          set -euo pipefail
          test -f AulaFinder_SITE.zip
          mkdir -p _site
          unzip -q AulaFinder_SITE.zip -d _site
          test -f _site/index.html
          test -f _site/assets/logo-aulafinder.webp
          test -f _site/script.js
          test -f _site/v52.css
          test -f _site/sw.js
          test -f _site/diagnostica.html
          python3 - <<'PYVERIFY'
          from pathlib import Path
          from html.parser import HTMLParser
          base=Path('_site')
          class RefChecker(HTMLParser):
              def __init__(self): super().__init__(); self.errors=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  for key in ('src','href','poster'):
                      value=a.get(key,'')
                      if not value or value.startswith(('http:','https:','#','data:','mailto:','tel:','//')): continue
                      target=(base/value.split('?',1)[0]).resolve()
                      if not target.is_relative_to(base.resolve()) or not target.exists(): self.errors.append(value)
          check=RefChecker();check.feed((base/'index.html').read_text(encoding='utf-8'))
          if check.errors: raise SystemExit('Risorse HTML mancanti: '+', '.join(check.errors))
          print('HTML e riferimenti relativi validati, file:',len(list(base.rglob('*'))))
          PYVERIFY
      - name: Carica il sito completo
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
